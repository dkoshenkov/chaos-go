replicaCount: 1

image:
  repository: chaos-proxy
  tag: ""
  pullPolicy: IfNotPresent

# Point to the backend Service in the cluster.
upstreamURL: http://backend:8080

# Chaos is enabled when a Secret name is supplied. The Secret must exist in the release namespace.
chaos:
  existingSecret:
    name: ""
    key: token
  abort:
    enabled: false
  probability:
    enabled: false
    default: 1.0
  requestJitter:
    enabled: false
  responseJitter:
    enabled: false
  requestBandwidth:
    enabled: false
  responseBandwidth:
    enabled: false
  connectionReset:
    enabled: false
    # Quote large byte counts to preserve their full integer precision in values files.
    afterBytes: "0"

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi
