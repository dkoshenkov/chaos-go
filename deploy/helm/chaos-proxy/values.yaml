replicaCount: 1

image:
  repository: chaos-proxy
  tag: ""
  pullPolicy: IfNotPresent

# Use http, tcp, or connect. The two tunnel modes take a TCP upstream address.
mode: http

# Point to the backend Service in the cluster.
upstreamURL: http://backend:8080

service:
  port: 8080

# HTTP and CONNECT chaos require a Secret in the release namespace.
# TCP mode enables chaos when connectionReset.enabled is true.
chaos:
  existingSecret:
    name: ""
    key: token
  abort:
    enabled: false
  probability:
    enabled: false
    default: 1.0
  requestJitter:
    enabled: false
  responseJitter:
    enabled: false
  requestBandwidth:
    enabled: false
  responseBandwidth:
    enabled: false
  connectionReset:
    enabled: false
    # Quote large byte counts to preserve their full integer precision in values files.
    afterBytes: "0"
  tunnelTimeout:
    max: 120s

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi
