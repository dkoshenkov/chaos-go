apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "chaos-proxy.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "chaos-proxy.selectorLabels" . | nindent 4 }}
  ports:
    - name: {{ include "chaos-proxy.portName" . }}
      port: {{ .Values.service.port }}
      targetPort: {{ include "chaos-proxy.portName" . }}
