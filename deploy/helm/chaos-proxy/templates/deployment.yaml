{{- $afterBytes := .Values.chaos.connectionReset.afterBytes -}}
{{- if kindIs "float64" $afterBytes -}}
  {{- if ge $afterBytes 9007199254740992.0 -}}
    {{- fail "Quote chaos.connectionReset.afterBytes values of 9007199254740992 or greater to preserve integer precision" -}}
  {{- end -}}
  {{- if ne $afterBytes (floor $afterBytes) -}}
    {{- fail "chaos.connectionReset.afterBytes must be a whole number" -}}
  {{- end -}}
  {{- $afterBytes = printf "%.0f" $afterBytes -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "chaos-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "chaos-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chaos-proxy.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: {{ printf "%s:%s" .Values.image.repository (default .Chart.AppVersion .Values.image.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: SERVER_LISTEN
              value: ":8080"
            - name: OBSERVABILITY_LISTEN
              value: ":9090"
            - name: UPSTREAM_URL
              value: {{ required "upstreamURL must point to the backend Service" .Values.upstreamURL | quote }}
            - name: CHAOS_ENABLED
              value: {{ not (empty .Values.chaos.existingSecret.name) | quote }}
            - name: CHAOS_ABORT_ENABLED
              value: {{ .Values.chaos.abort.enabled | quote }}
            - name: CHAOS_PROBABILITY_ENABLED
              value: {{ .Values.chaos.probability.enabled | quote }}
            - name: CHAOS_PROBABILITY_DEFAULT
              value: {{ .Values.chaos.probability.default | quote }}
            - name: CHAOS_REQUEST_JITTER_ENABLED
              value: {{ .Values.chaos.requestJitter.enabled | quote }}
            - name: CHAOS_RESPONSE_JITTER_ENABLED
              value: {{ .Values.chaos.responseJitter.enabled | quote }}
            - name: CHAOS_REQUEST_BANDWIDTH_ENABLED
              value: {{ .Values.chaos.requestBandwidth.enabled | quote }}
            - name: CHAOS_RESPONSE_BANDWIDTH_ENABLED
              value: {{ .Values.chaos.responseBandwidth.enabled | quote }}
            - name: CHAOS_CONNECTION_RESET_ENABLED
              value: {{ .Values.chaos.connectionReset.enabled | quote }}
            - name: CHAOS_CONNECTION_RESET_AFTER_BYTES
              value: {{ $afterBytes | quote }}
            {{- with .Values.chaos.existingSecret.name }}
            - name: CHAOS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ required "chaos.existingSecret.key must name the token key" $.Values.chaos.existingSecret.key | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
